# The Python trainer bridge (tools/trainer_bridge): its unittest suite, which tools/run_tests does
# not run and nothing else on GitHub does. The rest of what ble.yml ran is in lead.yml.
name: trainer-bridge

on:
  push:
    paths:
      - "addons/wattlands/trainer/ble/**"
      - "tools/trainer_bridge/**"
      - ".github/workflows/trainer-bridge.yml"
  pull_request:
    paths:
      - "addons/wattlands/trainer/ble/**"
      - "tools/trainer_bridge/**"
      - ".github/workflows/trainer-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install websockets
        run: python -m pip install "websockets>=13"
      - name: Bridge tests
        working-directory: tools/trainer_bridge
        run: |
          . ../env.sh
          python -m unittest discover -s tests -t . -v
