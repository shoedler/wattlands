# ble: GdbleTransport, BridgeTransport, FtmsConnectionManager (tests/ble) and the Python
# trainer bridge (tools/trainer_bridge). Runs only commands that ran green locally in W1.
name: ble

on:
  push:
    paths:
      - "addons/wattlands/trainer/ble/**"
      - "tests/ble/**"
      - "tools/trainer_bridge/**"
      - "content/strings/ble.csv"
      - ".github/workflows/ble.yml"
  pull_request:
    paths:
      - "addons/wattlands/trainer/ble/**"
      - "tests/ble/**"
      - "tools/trainer_bridge/**"
      - "content/strings/ble.csv"
      - ".github/workflows/ble.yml"

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WATTLANDS_NO_HW_CONTROL: "1"
      WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Godot 4.7.2 (standard build)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import
        run: |
          . tools/env.sh
          tools/godot.sh --headless --path . --import
      - name: GUT (tests/ble)
        shell: bash
        run: |
          . tools/env.sh
          mkdir -p build
          set +e
          tools/godot.sh --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/ble -ginclude_subdirs -gexit -gdisable_colors -gjunit_xml_file=build/junit_ble.xml 2>&1 | tee build/gut_ble.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 0
          grep -q "Run Summary" build/gut_ble.log
          if grep -E "SCRIPT ERROR|Parse Error|Debugger Break|Ignoring script|Nothing was run" build/gut_ble.log; then exit 1; fi
          grep -Eq 'tests="[1-9][0-9]*"' build/junit_ble.xml
      - name: Script check
        run: |
          . tools/env.sh
          tools/godot.sh --headless --path . -s tools/check_scripts.gd

  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install websockets
        run: python -m pip install "websockets>=13"
      - name: Bridge tests
        working-directory: tools/trainer_bridge
        run: |
          . ../env.sh
          python -m unittest discover -s tests -t . -v
