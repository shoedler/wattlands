name: app-shell

on:
  push:
    paths:
      - "src/app/**"
      - "content/strings/app.csv"
      - "tests/app/**"
      - ".github/workflows/app-shell.yml"
  pull_request:
    paths:
      - "src/app/**"
      - "content/strings/app.csv"
      - "tests/app/**"
      - ".github/workflows/app-shell.yml"

jobs:
  app-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
      WATTLANDS_NO_HW_CONTROL: "1"
      WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Godot (standard build)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import
        run: tools/godot.sh --headless --path . --import
      - name: Script check
        run: tools/godot.sh --headless --path . -s tools/check_scripts.gd
      - name: App shell tests
        run: |
          mkdir -p build
          tools/godot.sh --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/app -ginclude_subdirs -gexit -gdisable_colors -gjunit_xml_file=build/junit_app.xml 2>&1 | tee build/gut_app.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "Run Summary" build/gut_app.log
          if grep -qE "SCRIPT ERROR|Parse Error|Debugger Break|Ignoring script|Nothing was run" build/gut_app.log; then exit 1; fi
