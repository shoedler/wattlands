# net-client CI (BRIEF 7.9): GUT for tests/net and the static script check on Linux.
# Written in YAML's JSON-compatible flow style, so `node` can verify that it parses
# (no YAML parser is available offline); GitHub reads it as ordinary YAML.
{
  "name": "net-client",
  "on": {
    "push": {
      "paths": ["addons/wattlands/net/**", "addons/wattlands/contracts/**", "tests/net/**",
        "content/strings/net.csv", "docs/PROTOCOL.md", ".github/workflows/net-client.yml"]
    },
    "pull_request": {
      "paths": ["addons/wattlands/net/**", "addons/wattlands/contracts/**", "tests/net/**",
        "content/strings/net.csv", "docs/PROTOCOL.md", ".github/workflows/net-client.yml"]
    },
    "workflow_dispatch": {}
  },
  "jobs": {
    "net": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "GODOT_VERSION": "4.7.2",
        "WATTLANDS_NO_HW_CONTROL": "1",
        "WATTLANDS_NO_NETWORK_INTEGRATIONS": "1"
      },
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
        {
          "name": "Install Godot (standard build)",
          "run": "curl -fsSL -o \"$RUNNER_TEMP/godot.zip\" \"https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip\"\nunzip -q \"$RUNNER_TEMP/godot.zip\" -d \"$RUNNER_TEMP/godot\"\necho \"GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64\" >> \"$GITHUB_ENV\""
        },
        {"name": "Import", "run": "tools/godot.sh --headless --path . --import"},
        {
          "name": "GUT tests/net",
          "run": "set -o pipefail\nmkdir -p build\ntools/godot.sh --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/net -ginclude_subdirs -gexit -gdisable_colors -gjunit_xml_file=build/junit_net-client.xml 2>&1 | tee build/gut_net-client.log\ngrep -q 'Run Summary' build/gut_net-client.log\n! grep -E 'SCRIPT ERROR|Parse Error|Debugger Break|Ignoring script|Nothing was run' build/gut_net-client.log"
        },
        {"name": "Script check", "run": "tools/godot.sh --headless --path . -s tools/check_scripts.gd"},
        {
          "name": "Upload JUnit",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {"name": "net-client-junit", "path": "build/junit_net-client.xml"}
        }
      ]
    }
  }
}
