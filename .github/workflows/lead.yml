# lead: every BRIEF 7 gate in one job, exactly as tools/run_tests runs them locally: import, the full GUT suite (unit, contracts,
# integration, the Workout scenarios, conformance), the 7.3 scaffold check, check_scripts
# with gdlint and gdformat --check (gdtoolkit 4.5.0, ./gdlintrc) and the workflow YAML parse (uv),
# tools/run_game_sim over every registered game's contents plus tools/fit_check on the FIT
# files, every Node suite (wrappers and lock, relay, mock Strava, art pipeline and its pixelate
# end-to-end, fit_check, the e2e harness's own tests) and the 3-peer end-to-end test
# (node tools/e2e/run.mjs --games=<every registered game>).
name: lead

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, so a pull request hears about ownership, safety pins and test counts long before the
  # full suite ends. Pinned and maintainer-only files are named for review, not failed.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tools/gate check
        run: |
          git fetch origin "${{ github.base_ref }}:refs/heads/${{ github.base_ref }}" || true
          tools/gate check --base="${{ github.base_ref }}" --contributor

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GODOT_VERSION: "4.7.2"
      WATTLANDS_NO_HW_CONTROL: "1"
      WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Godot (Linux build)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install gdtoolkit (gdlint, gdformat) and uv (the workflow YAML check) for the static gate
        run: |
          pipx install gdtoolkit==4.5.0
          pipx install uv==0.13.1
      - name: All gates (tools/run_tests)
        run: tools/run_tests
      - name: fit_check on the FIT the GUT suite wrote, with its lap count
        run: node tools/fit_check/check.mjs build/rides_test --expect-laps=5
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-tests-logs
          path: |
            build/*.log
            build/junit.xml
            build/e2e/**/report.json
          if-no-files-found: ignore
