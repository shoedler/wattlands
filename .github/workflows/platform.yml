# Platform module (addons/wattlands/core, tests/core): GUT unit tests and the script check.
# Owned by platform. Never executed during the autonomous build (nothing is pushed), so it
# is unverified on GitHub; the same commands ran green locally through tools/godot.sh.
name: platform

on:
  push:
    paths:
      - "addons/wattlands/core/**"
      - "tests/core/**"
      - "content/strings/core.csv"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "addons/wattlands/core/**"
      - "tests/core/**"
      - "content/strings/core.csv"
      - ".github/workflows/platform.yml"
  workflow_dispatch:

env:
  WATTLANDS_NO_HW_CONTROL: "1"
  WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
  GODOT_VERSION: "4.7.2"

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Godot (standard build)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import
        run: tools/godot.sh --headless --path . --import || true

      - name: GUT (tests/core)
        run: |
          set -uo pipefail
          mkdir -p build
          tools/godot.sh --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/core -gexit -gdisable_colors -gjunit_xml_file=build/junit_core.xml 2>&1 | tee build/gut_core.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0
          grep -q "Run Summary" build/gut_core.log
          if grep -E -q "SCRIPT ERROR|Parse Error|Debugger Break|Ignoring script|Nothing was run" build/gut_core.log; then
            echo "forbidden string in the GUT log"; exit 1
          fi
          tests=$(grep -o 'tests="[0-9]*"' build/junit_core.xml | head -1 | grep -o '[0-9]*')
          test "${tests:-0}" -gt 0

      - name: Script check
        run: tools/godot.sh --headless --path . -s tools/check_scripts.gd
