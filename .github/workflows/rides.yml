# Rides module (addons/wattlands/rides, tests/rides, server/mock_strava, tools/fit_check):
# the mock Strava and fit_check Node suites, the rides GUT suite (FIT encoder, recorder, laps,
# Strava client against the mock, network lock) and fit_check on the FIT the GUT suite writes.
# Owned by rides. Never executed during the autonomous build (nothing is pushed), so it is
# unverified on GitHub; every run step below ran green locally (BRIEF 7.9). The Godot
# download is setup only.
name: rides

on:
  push:
    paths:
      - "addons/wattlands/rides/**"
      - "addons/wattlands/contracts/**"
      - "addons/wattlands/core/**"
      - "tests/rides/**"
      - "server/mock_strava/**"
      - "tools/fit_check/**"
      - "content/strings/rides.csv"
      - ".github/workflows/rides.yml"
  pull_request:
    paths:
      - "addons/wattlands/rides/**"
      - "addons/wattlands/contracts/**"
      - "addons/wattlands/core/**"
      - "tests/rides/**"
      - "server/mock_strava/**"
      - "tools/fit_check/**"
      - "content/strings/rides.csv"
      - ".github/workflows/rides.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rides:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
      WATTLANDS_NO_HW_CONTROL: "1"
      WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Mock Strava (node:test)
        working-directory: server/mock_strava
        run: node --test

      - name: fit_check (npm ci, node:test)
        run: |
          set -euo pipefail
          npm ci --prefix tools/fit_check --no-audit --no-fund
          cd tools/fit_check
          node --test

      - name: Install Godot (standard Linux build)
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import
        run: tools/godot.sh --headless --path . --import || true

      - name: GUT (tests/rides, strict gate)
        run: |
          set -uo pipefail
          mkdir -p build
          tools/godot.sh --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/rides -ginclude_subdirs -gexit -gdisable_colors -gjunit_xml_file=build/junit_rides.xml 2>&1 | tee build/gut_rides.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0
          grep -q "Run Summary" build/gut_rides.log
          if grep -E -q "SCRIPT ERROR|Parse Error|Debugger Break|Ignoring script|Nothing was run" build/gut_rides.log; then
            echo "forbidden string in the GUT log"; exit 1
          fi
          tests=$(grep -o 'tests="[0-9]*"' build/junit_rides.xml | head -1 | grep -o '[0-9]*')
          test "${tests:-0}" -gt 0

      - name: fit_check on the FIT the GUT suite wrote
        run: node tools/fit_check/check.mjs build/rides_test --expect-laps=5

      - name: Script check
        run: tools/godot.sh --headless --path . -s tools/check_scripts.gd

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rides-logs
          path: |
            build/*.log
            build/junit_rides.xml
            build/rides_test/
          if-no-files-found: ignore
