# trainer-core: FTMS codec, FtmsClient, FtmsTrainer and MockTrainer (BRIEF 7.9).
# Every run step is a command the W1 build ran green locally; CI on GitHub is unverified.
name: trainer-core

on:
  push:
    paths:
      - "addons/wattlands/trainer/*"
      - "tests/trainer/**"
      - "tests/vectors/**"
      - "content/strings/trainer.csv"
      - ".github/workflows/trainer-core.yml"
  pull_request:
    paths:
      - "addons/wattlands/trainer/*"
      - "tests/trainer/**"
      - "tests/vectors/**"
      - "content/strings/trainer.csv"
      - ".github/workflows/trainer-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WATTLANDS_NO_HW_CONTROL: "1"
      WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import
        run: tools/godot.sh --headless --path . --import
      - name: Trainer tests (GUT)
        run: |
          mkdir -p build
          tools/godot.sh --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/trainer -ginclude_subdirs -gexit -gdisable_colors -gjunit_xml_file=build/junit_trainer.xml 2>&1 | tee build/gut_trainer.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "Run Summary" build/gut_trainer.log
          ! grep -E "SCRIPT ERROR|Parse Error|Debugger Break|Ignoring script|Nothing was run" build/gut_trainer.log
      - name: Script check
        run: tools/godot.sh --headless --path . -s tools/check_scripts.gd
