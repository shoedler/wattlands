# Art pipeline (BRIEF 3.10, 7.1, 7.6): the tools/art node:test suite against mock_fal, the ArtPixelate
# GUT tests, the script check, and the generate + pixelate end-to-end check. No step ever has FAL_KEY or
# WATTLANDS_ALLOW_ART; generation only talks to tools/art/mock_fal.
name: art-pipeline

on:
  push:
    paths:
      - "tools/art/**"
      - "tests/art/**"
      - "docs/ART_PIPELINE.md"
      - ".github/workflows/art-pipeline.yml"
  pull_request:
    paths:
      - "tools/art/**"
      - "tests/art/**"
      - "docs/ART_PIPELINE.md"
      - ".github/workflows/art-pipeline.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  WATTLANDS_NO_HW_CONTROL: "1"
  WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"

jobs:
  node:
    name: node --test (tools/art)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: node:test against mock_fal
        working-directory: tools/art
        run: env -u FAL_KEY -u WATTLANDS_ALLOW_ART node --test

  godot:
    name: GUT (tests/art), check_scripts, pixelate end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install Godot (standard build)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import
        run: tools/godot.sh --headless --path . --import || true
      - name: GUT (tests/art, BRIEF 7 strict rules; run_tests strips FAL_KEY and WATTLANDS_ALLOW_ART)
        run: env -u FAL_KEY -u WATTLANDS_ALLOW_ART tools/run_tests --only=gut --gdir=res://tests/art
      - name: check_scripts
        run: tools/godot.sh --headless --path . -s tools/check_scripts.gd
      - name: generate + pixelate end to end (mock_fal)
        run: env -u FAL_KEY -u WATTLANDS_ALLOW_ART node tools/art/pixelate_e2e.mjs
