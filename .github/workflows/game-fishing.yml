# Big Game Fishing (docs/games/fishing.md section 4): the game's own GUT tests (BRIEF 7 strict
# rules: unit, art palette and integration tests under tests/games/fishing), its Node tests (the
# sim checker and the e2e report checker, against fixture reports), the script check; a second
# job runs the quick subset of the simulation matrix (tests/games/fishing/sim/run_sims.sh --quick:
# e2e_2min with 3 riders, the determinism pair and fit_check on every FIT) through
# tools/run_game_sim with the check_sims.mjs assertions. The full matrix (run_sims.sh), the e2e run
# (node tools/e2e/run.mjs --games=fishing) and tools/run_tests belong to the lead's suite.
# Linux, the standard Godot 4.7.2 build, both locks on, FAL_KEY and WATTLANDS_ALLOW_ART never set.
# Nothing is pushed during a build, so GitHub never runs this there: each step passed locally.
name: game-fishing

on:
  push:
    paths:
      - "src/games/fishing/**"
      - "content/fishing/**"
      - "assets/fishing/**"
      - "tests/games/fishing/**"
      - ".github/workflows/game-fishing.yml"
  pull_request:
    paths:
      - "src/games/fishing/**"
      - "content/fishing/**"
      - "assets/fishing/**"
      - "tests/games/fishing/**"
      - ".github/workflows/game-fishing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
      WATTLANDS_NO_HW_CONTROL: "1"
      WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Godot (standard Linux build)
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import
        run: tools/godot.sh --headless --path . --import || echo "import exited non-zero (not a gate)"

      - name: Fishing GUT tests (unit, art, integration; BRIEF 7 strict rules)
        run: tools/run_tests --only=gut --gdir=res://tests/games/fishing

      - name: Fishing Node tests (sim checker, e2e report checker)
        working-directory: tests/games/fishing
        run: node --test

      - name: Script check
        run: tools/godot.sh --headless --path . -s tools/check_scripts.gd

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishing-test-logs
          path: |
            build/*.log
            build/junit.xml
          if-no-files-found: ignore

  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    env:
      GODOT_VERSION: "4.7.2"
      WATTLANDS_NO_HW_CONTROL: "1"
      WATTLANDS_NO_NETWORK_INTEGRATIONS: "1"
      FISHING_GODOT_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Godot (standard Linux build)
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import
        run: tools/godot.sh --headless --path . --import || echo "import exited non-zero (not a gate)"

      - name: Simulation subset (S10, S8 on e2e_2min, S9 fit_check) and check_sims
        run: bash tests/games/fishing/sim/run_sims.sh --quick

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishing-sim-reports
          path: build/fishing/sims/*.json
          if-no-files-found: ignore
