# Example Fly.io config for the Wattlands relay (BRIEF 5.3, P1). Not deployed by the build.
# From server/relay: change `app`, then `fly launch --copy-config --no-deploy` and `fly deploy`.
# Rooms live in memory: keep exactly one machine (`fly scale count 1`).
# Clients connect to wss://<app>.fly.dev/v1.

app = "wattlands-relay-example"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  # Fly's proxy sets Fly-Client-IP itself; the relay reads only that header in this mode.
  # (Not "1": that reads the last X-Forwarded-For entry. See README.md, "Behind a proxy".)
  RELAY_TRUST_PROXY = "fly"

[http_service]
  internal_port = 8787
  force_https = true
  # Stopping the machine would drop every room; keep it running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
